<div class="flex min-h-screen bg-gray-50">
  <!-- Desktop sidebar -->
  <aside class="hidden w-64 flex-col border-r border-gray-200 bg-white md:flex">
    <div class="flex h-16 items-center border-b border-gray-200 px-6">
      <span class="text-xl font-semibold text-blue-600">RM Portal</span>
    </div>
    <nav class="flex-1 space-y-1 px-3 py-6">
      <a
        *ngFor="let link of navLinks"
        [routerLink]="link.route"
        routerLinkActive="bg-blue-50 text-blue-600"
        [routerLinkActiveOptions]="{ exact: link.exact }"
        class="flex items-center rounded-md px-3 py-2 text-sm font-medium text-gray-600 transition-colors hover:bg-blue-50 hover:text-blue-600"
      >
        {{ link.label }}
      </a>
    </nav>
  </aside>

  <div class="flex min-h-screen flex-1 flex-col">
    <!-- Mobile header -->
    <header class="border-b border-gray-200 bg-white md:hidden">
      <div class="flex items-center justify-between px-4 py-3">
        <span class="text-lg font-semibold text-blue-600">RM Portal</span>
        <button
          type="button"
          class="inline-flex items-center rounded-md border border-transparent bg-blue-600 p-2 text-white shadow-sm transition hover:bg-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2"
          (click)="toggleSidebar()"
          aria-controls="mobile-sidebar"
          [attr.aria-expanded]="isSidebarOpen()"
        >
          <span class="sr-only">Toggle navigation</span>
          <svg class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
            <path
              fill-rule="evenodd"
              d="M3 5a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm0 5a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm1 4a1 1 0 000 2h12a1 1 0 100-2H4z"
              clip-rule="evenodd"
            />
          </svg>
        </button>
      </div>
    </header>

    <main class="flex-1 px-4 py-6 sm:px-6 lg:px-8">
      <router-outlet />
    </main>
  </div>
</div>

<!-- Mobile sidebar overlay -->
<div *ngIf="isSidebarOpen()" class="md:hidden" id="mobile-sidebar">
  <div class="fixed inset-0 bg-gray-900/50" aria-hidden="true" (click)="closeSidebar()"></div>

  <aside class="fixed inset-y-0 left-0 flex w-64 flex-col border-r border-gray-200 bg-white shadow-lg">
    <div class="flex h-16 items-center justify-between border-b border-gray-200 px-6">
      <span class="text-lg font-semibold text-blue-600">RM Portal</span>
      <button
        type="button"
        class="inline-flex items-center rounded-md border border-transparent bg-blue-600 p-2 text-white shadow-sm transition hover:bg-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2"
        (click)="closeSidebar()"
      >
        <span class="sr-only">Close navigation</span>
        <svg class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
          <path
            fill-rule="evenodd"
            d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z"
            clip-rule="evenodd"
          />
        </svg>
      </button>
    </div>
    <nav class="flex-1 space-y-1 px-3 py-6">
      <a
        *ngFor="let link of navLinks"
        [routerLink]="link.route"
        routerLinkActive="bg-blue-50 text-blue-600"
        [routerLinkActiveOptions]="{ exact: link.exact }"
        class="flex items-center rounded-md px-3 py-2 text-sm font-medium text-gray-600 transition-colors hover:bg-blue-50 hover:text-blue-600"
        (click)="closeSidebar()"
      >
        {{ link.label }}
      </a>
    </nav>
  </aside>
</div>
