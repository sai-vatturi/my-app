<aside 
  [class]="isCollapsed() ? 'w-16' : 'w-56'" 
  class="bg-gradient-to-b from-gray-900 to-gray-800 text-white min-h-screen fixed left-0 top-0 overflow-y-auto overflow-x-hidden shadow-2xl transition-all duration-300 ease-in-out z-50 flex flex-col">
  
  <!-- Header / Branding -->
  <div 
    [class]="isCollapsed() ? 'p-3' : 'p-4'" 
    class="border-b border-gray-700 transition-all duration-300 flex-shrink-0">
    <div class="flex items-center justify-between">
      <div [class]="isCollapsed() ? 'hidden' : 'block'" class="transition-opacity duration-300">
        <h1 class="text-base font-semibold tracking-tight leading-tight" style="font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;">
          APAC Release Management
        </h1>
        <p class="text-[10px] text-gray-400 mt-0.5 uppercase tracking-wide">Release Portal</p>
      </div>
      <div *ngIf="isCollapsed()" class="w-full flex justify-center">
        <div class="text-base font-bold text-primary-400" style="font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;">RMP</div>
      </div>
    </div>
  </div>
  
  <!-- Navigation -->
  <nav [class]="isCollapsed() ? 'p-2' : 'p-3'" class="transition-all duration-300 flex-1" role="navigation" aria-label="Main navigation">
    <ul [class]="isCollapsed() ? 'space-y-1' : 'space-y-1.5'" class="transition-all duration-300">
      <li *ngFor="let item of navItems">
        <a
          [routerLink]="item.path"
          routerLinkActive="bg-primary-600 shadow-lg"
          [routerLinkActiveOptions]="{ exact: item.path === '/' }"
          [class]="isCollapsed() ? 'justify-center px-2 py-2.5' : 'space-x-2.5 px-3 py-2'"
          class="flex items-center rounded-lg hover:bg-gray-700 transition-all duration-200 group relative"
          [attr.aria-label]="item.label"
          [title]="isCollapsed() ? item.label : ''">
          <lucide-icon 
            [img]="item.icon" 
            [size]="18"
            class="text-gray-300 group-hover:text-white transition-colors flex-shrink-0"
          ></lucide-icon>
          <span 
            *ngIf="!isCollapsed()" 
            class="font-medium text-sm transition-opacity duration-300">
            {{ item.label }}
          </span>
          
          <!-- Tooltip for collapsed state -->
          <div 
            *ngIf="isCollapsed()"
            class="absolute left-full ml-2 px-2 py-1 bg-gray-900 text-white text-xs rounded shadow-lg opacity-0 group-hover:opacity-100 transition-opacity duration-200 pointer-events-none whitespace-nowrap z-50">
            {{ item.label }}
          </div>
        </a>
      </li>
    </ul>
  </nav>

  <!-- Toggle Button at Bottom -->
  <div class="flex-shrink-0 border-t border-gray-700 p-3">
    <button
      (click)="toggleSidebar()"
      [class]="isCollapsed() ? 'w-full justify-center' : 'w-full justify-between'"
      class="flex items-center px-3 py-2 rounded-lg hover:bg-gray-700 transition-all duration-200 group text-sm"
      [attr.aria-label]="isCollapsed() ? 'Expand sidebar' : 'Collapse sidebar'"
      [title]="isCollapsed() ? 'Expand sidebar' : 'Collapse sidebar'">
      <span *ngIf="!isCollapsed()" class="text-gray-300 font-medium">Collapse</span>
      <lucide-icon 
        [img]="isCollapsed() ? ChevronRight : ChevronLeft" 
        [size]="16"
        class="text-gray-300 group-hover:text-white transition-colors"
      ></lucide-icon>
    </button>
  </div>
</aside>
