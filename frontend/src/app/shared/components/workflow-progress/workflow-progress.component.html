<div class="space-y-4" *ngIf="workflow && product">
  <app-alert *ngIf="error()" [message]="error()!" type="error" />

  <div class="flex overflow-x-auto pb-6 pt-4 px-4 gap-0 scrollbar-thin items-start min-h-[200px]">
    <ng-container *ngFor="let stageDisplay of stages(); let isLast = last">
      <div class="relative flex flex-col items-center flex-shrink-0 w-56 group">

        <!-- Connecting Line (Right side) -->
        <div *ngIf="!isLast" class="absolute top-4 left-1/2 w-full h-1 -z-10"
          [ngClass]="stageDisplay.status === 'completed' ? 'bg-green-500' : 'bg-gray-200'">
          <!-- Arrow head in the middle of the line -->
          <div class="absolute right-0 -top-1.5 text-gray-300" *ngIf="stageDisplay.status !== 'completed'">
            <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
              <path fill-rule="evenodd"
                d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z"
                clip-rule="evenodd"></path>
            </svg>
          </div>
          <div class="absolute right-0 -top-1.5 text-green-500" *ngIf="stageDisplay.status === 'completed'">
            <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
              <path fill-rule="evenodd"
                d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z"
                clip-rule="evenodd"></path>
            </svg>
          </div>
        </div>

        <!-- Node (Circle) -->
        <div
          class="relative z-10 w-9 h-9 rounded-full flex items-center justify-center border-2 transition-all shadow-sm bg-white"
          [ngClass]="{
               'border-green-500 text-green-600 bg-green-50': stageDisplay.status === 'completed',
               'border-blue-600 text-blue-600 ring-4 ring-blue-100 scale-110': stageDisplay.status === 'current',
               'border-gray-300 text-gray-400': stageDisplay.status === 'upcoming'
             }">
          <span class="text-xs font-bold">
            <ng-container *ngIf="stageDisplay.status === 'completed'">✓</ng-container>
            <ng-container *ngIf="stageDisplay.status === 'current'">{{ stageDisplay.stage.order }}</ng-container>
            <ng-container *ngIf="stageDisplay.status === 'upcoming'">{{ stageDisplay.stage.order }}</ng-container>
          </span>
        </div>

        <!-- Content -->
        <div class="mt-4 flex flex-col items-center text-center w-full px-2 space-y-2">
          <!-- Title -->
          <h4 class="text-sm font-bold text-gray-900 leading-tight"
            [class.text-blue-700]="stageDisplay.status === 'current'" [title]="stageDisplay.stage.name">
            {{ stageDisplay.stage.name }}
          </h4>

          <!-- Date if completed -->
          <span *ngIf="stageDisplay.state?.completed_at"
            class="text-[10px] font-medium text-gray-500 bg-gray-100 px-2 py-0.5 rounded-full">
            {{ stageDisplay.state?.completed_at | date:'MMM d, h:mm a' }}
          </span>

          <!-- Tags -->
          <div class="flex flex-wrap justify-center gap-1">
            <span *ngIf="stageDisplay.stage.requires_attachment"
              class="text-[10px] px-1.5 py-0.5 bg-yellow-50 text-yellow-700 rounded border border-yellow-200 font-medium">
              Attach
            </span>
            <span *ngIf="stageDisplay.stage.attachment_mandatory"
              class="text-[10px] px-1.5 py-0.5 bg-orange-50 text-orange-700 rounded border border-orange-200 font-medium">
              Mandatory
            </span>
          </div>

          <!-- Attachment File -->
          <div *ngIf="stageDisplay.state?.attachment_id"
            class="flex items-center gap-1 text-[10px] text-blue-700 bg-blue-50 px-3 py-1.5 rounded-full max-w-full border border-blue-200 cursor-pointer hover:bg-blue-100 transition-colors shadow-sm"
            (click)="downloadAttachment(stageDisplay.state?.attachment_id || '')" title="Click to download">
            <span class="truncate max-w-[120px] font-medium">{{ stageDisplay.state?.attachment_filename }}</span>
            <span class="text-xs">⬇</span>
          </div>

          <!-- Actions (Only for current stage) -->
          <div *ngIf="stageDisplay.status === 'current'"
            class="flex flex-col gap-2 w-full max-w-[160px] mt-2 p-3 bg-blue-50 rounded-lg border border-blue-100 shadow-sm">
            <div class="text-[10px] font-semibold text-blue-800 uppercase tracking-wide mb-1">Current Step</div>

            <!-- Upload -->
            <label *ngIf="stageDisplay.stage.requires_attachment"
              class="cursor-pointer text-xs bg-white border border-blue-200 hover:bg-blue-50 text-blue-700 py-2 px-3 rounded-md text-center shadow-sm transition-all flex items-center justify-center gap-2 font-medium">
              <span>📎</span> {{ stageDisplay.state?.attachment_id ? 'Replace File' : 'Upload File' }}
              <input type="file" class="hidden" (change)="uploadAttachment(stageDisplay.stage.order, $event)"
                [disabled]="processing()">
            </label>

            <!-- Advance -->
            <button *ngIf="stageDisplay.canAdvance" (click)="advanceStage()" [disabled]="processing()"
              class="text-xs bg-blue-600 hover:bg-blue-700 text-white py-2 px-3 rounded-md shadow-md transition-all flex items-center justify-center gap-2 font-bold transform hover:scale-105 active:scale-95">
              {{ processing() ? 'Processing...' : 'Advance Stage' }}
              <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3">
                </path>
              </svg>
            </button>

            <!-- Blocked Message -->
            <div *ngIf="!stageDisplay.canAdvance"
              class="flex items-center gap-1 text-[10px] text-orange-700 font-medium bg-orange-100 px-2 py-1 rounded border border-orange-200">
              <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z">
                </path>
              </svg>
              Upload required to advance
            </div>
          </div>
        </div>
      </div>
    </ng-container>
  </div>
</div>
