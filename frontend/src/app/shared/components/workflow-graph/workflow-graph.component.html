<div class="workflow-graph-container">
  <!-- Release Node -->
  <div class="flex items-center mb-8" *ngIf="release">
    <div class="bg-indigo-600 text-white px-6 py-4 rounded-lg shadow-lg font-semibold text-lg min-w-[200px] text-center">
      {{ release.name }}
    </div>
  </div>

  <!-- Products and Stages -->
  <div class="space-y-6">
    <div *ngFor="let productNode of productNodes(); let isLast = last" class="relative">
      <div class="flex items-start gap-4">
        <!-- Product Node -->
        <div class="flex-shrink-0 bg-purple-100 border-2 border-purple-300 px-4 py-3 rounded-lg font-semibold text-purple-900 min-w-[150px] text-center">
          {{ productNode.productName }}
        </div>
        
        <!-- Arrow -->
        <div class="flex-shrink-0 flex items-center">
          <svg class="w-8 h-0.5 text-gray-400" fill="currentColor">
            <line x1="0" y1="0" x2="100%" y2="0" stroke="currentColor" stroke-width="2"/>
            <polygon points="100%,0 90%,-5 90%,5" fill="currentColor"/>
          </svg>
        </div>
        
        <!-- Stages -->
        <div class="flex-1 flex items-center gap-3 overflow-x-auto pb-4">
          <div *ngFor="let stageNode of productNode.stages; let isLastStage = last" class="flex items-center gap-3">
            <div [ngClass]="getStageClass(stageNode)" class="relative">
              <div class="flex items-center justify-center w-8 h-8 rounded-full mb-2 font-bold text-sm"
                [ngClass]="{
                  'bg-green-500 text-white': stageNode.status === 'completed',
                  'bg-blue-500 text-white': stageNode.status === 'current',
                  'bg-gray-300 text-gray-600': stageNode.status === 'upcoming'
                }">
                {{ getStatusIcon(stageNode) }}
              </div>
              <div class="text-xs font-semibold text-center mb-1">{{ stageNode.stage.name }}</div>
              <div *ngIf="stageNode.deadline" 
                class="text-xs text-center"
                [ngClass]="{
                  'text-red-600 font-semibold': isOverdue(stageNode.deadline),
                  'text-gray-600': !isOverdue(stageNode.deadline)
                }">
                {{ formatDeadline(stageNode.deadline) }}
                <span *ngIf="isOverdue(stageNode.deadline)" class="ml-1">⚠️</span>
              </div>
            </div>
            
            <!-- Connector Arrow -->
            <div *ngIf="!isLastStage" class="flex-shrink-0 flex items-center">
              <svg class="w-6 h-0.5 text-gray-400" fill="currentColor">
                <line x1="0" y1="0" x2="100%" y2="0" stroke="currentColor" stroke-width="2"/>
                <polygon points="100%,0 85%,-4 85%,4" fill="currentColor"/>
              </svg>
            </div>
          </div>
        </div>
      </div>
      
      <!-- Vertical Connector -->
      <div *ngIf="!isLast" class="absolute left-[75px] top-full w-0.5 h-6 bg-gray-300"></div>
    </div>
  </div>
</div>

<style>
.workflow-graph-container {
  min-width: 100%;
  padding: 1rem;
}
</style>
