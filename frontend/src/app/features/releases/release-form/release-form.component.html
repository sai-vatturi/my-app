<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
  <div class="max-w-4xl">
    <h1 class="text-3xl font-bold text-gray-900 mb-8">{{ isEdit ? 'Edit' : 'Create' }} Release</h1>
    <app-alert *ngIf="error()" [message]="error()!" type="error" />
    <app-loading-spinner *ngIf="loading()" />

    <!-- Stepper -->
    <div class="mb-8 mx-4 sm:mx-8 lg:mx-12">
      <div class="flex items-center justify-center gap-12 sm:gap-16 lg:gap-24 relative">
        <div
          class="absolute left-1/2 top-1/2 transform -translate-x-1/2 -translate-y-1/2 w-48 sm:w-64 lg:w-80 h-0.5 bg-gray-200 -z-10">
        </div>

        <!-- Step 1 -->
        <div class="flex flex-col items-center relative z-10" [class.cursor-pointer]="isEdit"
          (click)="isEdit && currentStep.set(1)">
          <div
            class="w-10 h-10 rounded-full flex items-center justify-center font-bold text-sm transition-colors duration-200 shadow-sm"
            [class.bg-primary-600]="currentStep() >= 1" [class.text-white]="currentStep() >= 1"
            [class.bg-gray-200]="currentStep() < 1" [class.text-gray-500]="currentStep() < 1"
            [class.hover:bg-primary-700]="isEdit && currentStep() !== 1">
            1
          </div>
          <span class="text-sm font-medium mt-2" [class.text-primary-600]="currentStep() >= 1">Info</span>
        </div>

        <!-- Step 2 -->
        <div class="flex flex-col items-center relative z-10" [class.cursor-pointer]="isEdit"
          (click)="isEdit && currentStep.set(2)">
          <div
            class="w-10 h-10 rounded-full flex items-center justify-center font-bold text-sm transition-colors duration-200 shadow-sm"
            [class.bg-primary-600]="currentStep() >= 2" [class.text-white]="currentStep() >= 2"
            [class.bg-gray-200]="currentStep() < 2" [class.text-gray-500]="currentStep() < 2"
            [class.hover:bg-primary-700]="isEdit && currentStep() !== 2">
            2
          </div>
          <span class="text-sm font-medium mt-2" [class.text-primary-600]="currentStep() >= 2">Products</span>
        </div>

        <!-- Step 3 -->
        <div class="flex flex-col items-center relative z-10" [class.cursor-pointer]="isEdit"
          (click)="isEdit && currentStep.set(3)">
          <div
            class="w-10 h-10 rounded-full flex items-center justify-center font-bold text-sm transition-colors duration-200 shadow-sm"
            [class.bg-primary-600]="currentStep() >= 3" [class.text-white]="currentStep() >= 3"
            [class.bg-gray-200]="currentStep() < 3" [class.text-gray-500]="currentStep() < 3"
            [class.hover:bg-primary-700]="isEdit && currentStep() !== 3">
            3
          </div>
          <span class="text-sm font-medium mt-2" [class.text-primary-600]="currentStep() >= 3">Timeline</span>
        </div>
      </div>
    </div>


    <!-- Step 1: Basic Info -->
    <form *ngIf="currentStep() === 1 && !loading()" [formGroup]="form" (ngSubmit)="onSubmit()"
      class="space-y-8 bg-white shadow-md rounded-xl p-8 border border-gray-100">
      <!-- Name -->
      <div>
        <label for="name" class="block text-sm font-medium text-gray-700 mb-1">Release Name <span
            class="text-red-500">*</span></label>
        <input id="name" type="text" formControlName="name"
          class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500"
          [class.border-red-500]="form.get('name')?.invalid && form.get('name')?.touched"
          placeholder="e.g., MUM.2025.02.22" />
        <p *ngIf="form.get('name')?.invalid && form.get('name')?.touched" class="mt-1 text-sm text-red-600">Release name
          is required</p>
      </div>

      <!-- Description -->
      <div>
        <label for="description" class="block text-sm font-medium text-gray-700 mb-1">Description</label>
        <textarea id="description" formControlName="description" rows="3"
          class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500"></textarea>
      </div>

      <!-- Business Unit -->
      <div>
        <label for="business_unit_id" class="block text-sm font-medium text-gray-700 mb-1">Business Unit <span
            class="text-red-500">*</span></label>
        <select id="business_unit_id" formControlName="business_unit_id"
          class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500">
          <option value="">Select Business Unit</option>
          <option *ngFor="let unit of businessUnits()" [value]="unit.id || unit._id">
            {{ unit.name }}
          </option>
        </select>
      </div>

      <!-- Type -->
      <div>
        <label for="release_type" class="block text-sm font-medium text-gray-700 mb-1">Release Type <span
            class="text-red-500">*</span></label>
        <select id="release_type" formControlName="release_type"
          class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500">
          <option *ngFor="let type of releaseTypes()" [value]="type">{{ type }}</option>
        </select>
      </div>

      <!-- Release Date -->
      <div>
        <label for="release_date" class="block text-sm font-medium text-gray-700 mb-1">Release Date (SGT) <span
            class="text-red-500">*</span></label>
        <div class="flex gap-4">
          <div class="flex-1">
            <input id="release_date_day" type="date" formControlName="release_date_day"
              class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500"
              [class.border-red-500]="form.get('release_date_day')?.invalid && form.get('release_date_day')?.touched" />
          </div>
          <div class="w-1/3">
            <input id="release_date_time" type="time" formControlName="release_date_time"
              class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500"
              [class.border-red-500]="form.get('release_date_time')?.invalid && form.get('release_date_time')?.touched" />
          </div>
        </div>
      </div>

      <!-- CHG Number -->
      <div>
        <label for="chg_number" class="block text-sm font-medium text-gray-700 mb-1">Change Request Number</label>
        <input id="chg_number" type="text" formControlName="chg_number" placeholder="e.g., CHG20438093"
          class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500" />
      </div>

      <!-- Overall Scope -->
      <div>
        <label for="overall_scope" class="block text-sm font-medium text-gray-700 mb-1">Overall Scope</label>
        <textarea id="overall_scope" formControlName="overall_scope" rows="4"
          class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500"
          placeholder="Describe the overall scope and objectives of this release"></textarea>
      </div>

      <!-- Form Actions -->
      <div class="flex gap-4 pt-8 border-t">
        <app-button type="submit" [disabled]="form.invalid || submitting()" [loading]="submitting()">
          {{ isEdit ? 'Save Changes' : 'Next: Add Products' }}
        </app-button>
        <app-button type="button" variant="secondary" (clicked)="cancel()">Cancel</app-button>
      </div>
    </form>

    <!-- Step 2: Add Products -->
    <div *ngIf="currentStep() === 2 && !loading()" class="space-y-6">
      <div class="bg-white shadow-md rounded-xl p-8 border border-gray-100">
        <div class="flex items-center justify-between mb-6">
          <h2 class="text-xl font-bold text-gray-900">Release Products</h2>
          <app-button (clicked)="openAddProductDialog()">
            + Add Product
          </app-button>
        </div>

        <!-- Product List -->
        <app-release-products-table *ngIf="products().length > 0" [products]="products()" [productMap]="productMap"
          [mode]="'edit'" [showRemove]="true" (edit)="editProduct($event)" (remove)="removeProduct($event)">
        </app-release-products-table>

        <div *ngIf="products().length === 0"
          class="text-center py-12 bg-gray-50 rounded-lg border-2 border-dashed border-gray-300">
          <p class="text-gray-500">No products added yet. Click "Add Product" to start.</p>
        </div>

        <!-- Step 2 Actions -->
        <div class="flex gap-4 pt-8 mt-6 border-t">
          <app-button (clicked)="onSubmit()" [disabled]="products().length === 0">
            Next: Timeline
          </app-button>
          <app-button variant="secondary" (clicked)="prevStep()">Back</app-button>
        </div>
      </div>
    </div>

    <!-- Step 3: Timeline -->
    <div *ngIf="currentStep() === 3 && !loading()" class="space-y-6">
      <div class="bg-white shadow-md rounded-xl p-8 border border-gray-100">
        <h2 class="text-xl font-bold text-gray-900 mb-6">Release Timeline</h2>

        <app-timeline-editor *ngIf="createdRelease() && selectedWorkflow()" [release]="createdRelease()"
          [workflow]="selectedWorkflow()!" [products]="products()" [productMap]="productMap" [draftMode]="!isEdit"
          (releaseUpdated)="onReleaseUpdated($event)" (timelineUpdate)="onTimelineUpdate($event)">
        </app-timeline-editor>

        <!-- Step 3 Actions -->
        <div class="flex gap-4 pt-8 border-t mt-8">
          <app-button (clicked)="onSubmit()">
            Finish
          </app-button>
          <app-button variant="secondary" (clicked)="prevStep()">Back</app-button>
        </div>
      </div>
    </div>

    <!-- Product Edit Dialog (using shared component) -->
    <app-product-edit-dialog [visible]="editingProductIndex() !== null" [mode]="'edit'" [product]="editingProduct()"
      [productMap]="productMap" (save)="onSaveProduct($event)" (cancel)="closeProductDialog()">
    </app-product-edit-dialog>

    <!-- Add Product Dialog (using shared component) -->
    <app-product-edit-dialog [visible]="addingProduct()" [mode]="'add'" [product]="newProductData()"
      [productMap]="productMap" [availableProducts]="unselectedProducts()" (save)="onSaveNewProduct($event)"
      (cancel)="closeAddProductDialog()">
    </app-product-edit-dialog>
  </div>
</div>
