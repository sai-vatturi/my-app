<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
  <div class="space-y-8">
    <div class="flex justify-between items-center">
      <h1 class="text-3xl font-bold text-gray-900">Releases</h1>
      <app-button [routerLink]="['/releases/create']">Create Release</app-button>
    </div>

    <app-alert *ngIf="error()" [message]="error()!" type="error" />
    <app-loading-spinner *ngIf="loading()" />

    <!-- Desktop Table View -->
    <div *ngIf="!loading() && releases().length > 0" class="bg-white rounded-xl shadow-md overflow-hidden border border-gray-100 hidden md:block">
      <div class="overflow-x-auto">
        <table class="min-w-full divide-y divide-gray-200">
          <thead class="bg-gray-50">
            <tr>
              <th scope="col" class="px-4 md:px-8 py-4 text-left text-xs font-medium text-gray-500 uppercase">Release</th>
              <th scope="col" class="px-4 md:px-8 py-4 text-left text-xs font-medium text-gray-500 uppercase">Type</th>
              <th scope="col" class="px-4 md:px-8 py-4 text-left text-xs font-medium text-gray-500 uppercase">Status</th>
              <th scope="col" class="px-4 md:px-8 py-4 text-left text-xs font-medium text-gray-500 uppercase">Date</th>
              <th scope="col" class="px-4 md:px-8 py-4 text-left text-xs font-medium text-gray-500 uppercase">Products</th>
              <th scope="col" class="px-4 md:px-8 py-4 text-left text-xs font-medium text-gray-500 uppercase">CHG</th>
              <th scope="col" class="px-4 md:px-8 py-4 text-right text-xs font-medium text-gray-500 uppercase">Actions</th>
            </tr>
          </thead>
          <tbody class="bg-white divide-y divide-gray-200">
            <tr *ngFor="let release of releases()" class="hover:bg-gray-50 transition-colors">
              <td class="px-4 md:px-8 py-5">
                <a [routerLink]="['/releases', release.id]" class="text-sm font-semibold text-primary-600 hover:text-primary-700">
                  {{ release.name }}
                </a>
              </td>
              <td class="px-4 md:px-8 py-5">
                <app-status-badge [status]="release.release_type" type="type">{{ release.release_type }}</app-status-badge>
              </td>
              <td class="px-4 md:px-8 py-5">
                <app-status-badge [status]="release.status" type="status">{{ release.status }}</app-status-badge>
              </td>
              <td class="px-4 md:px-8 py-5 text-sm text-gray-600">
                {{ formatDate(release.release_date) }}
              </td>
              <td class="px-4 md:px-8 py-5 text-sm text-gray-600">
                {{ release.products.length }}
              </td>
              <td class="px-4 md:px-8 py-5 text-sm">
                <a *ngIf="release.chg_number" href="#" class="text-primary-600 hover:text-primary-700 font-medium">
                  {{ release.chg_number }}
                </a>
                <span *ngIf="!release.chg_number" class="text-gray-400">N/A</span>
              </td>
              <td class="px-4 md:px-8 py-5 text-right text-sm font-medium space-x-2 md:space-x-3">
                <a [routerLink]="['/releases', release.id]" class="text-primary-600 hover:text-primary-700 font-medium">View</a>
                <a [routerLink]="['/releases', release.id, 'edit']" class="text-primary-600 hover:text-primary-700 font-medium">Edit</a>
                <button (click)="deleteRelease(release)" class="text-red-600 hover:text-red-700 font-medium" [disabled]="deleting() === release.id">
                  {{ deleting() === release.id ? 'Deleting...' : 'Delete' }}
                </button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- Mobile Card View -->
    <div *ngIf="!loading() && releases().length > 0" class="md:hidden space-y-4">
      <app-release-card 
        *ngFor="let release of releases()" 
        [release]="release" 
        [isDeleting]="deleting() === release.id"
        (onDelete)="deleteRelease($event)">
      </app-release-card>
    </div>

    <div *ngIf="!loading() && releases().length === 0" class="text-center py-16 bg-white rounded-xl shadow-md border border-gray-100">
      <p class="text-gray-500 text-lg mb-4">No releases found</p>
      <app-button [routerLink]="['/releases/create']" class="mt-4">Create your first release</app-button>
    </div>
  </div>
</div>
