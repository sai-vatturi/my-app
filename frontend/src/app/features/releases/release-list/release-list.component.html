<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
  <div class="space-y-8">
    <div class="flex justify-between items-center">
      <h1 class="text-3xl font-bold text-gray-900">Releases</h1>
      <app-button [routerLink]="['/releases/create']">
        <lucide-icon [img]="Plus" [size]="20" class="mr-2"></lucide-icon>
        Add Release
      </app-button>
    </div>

    <app-alert *ngIf="error()" [message]="error()!" type="error" />
    <app-loading-spinner *ngIf="loading()" />

    <!-- Table View (Desktop & Mobile) -->
    <div *ngIf="!loading() && releases().length > 0"
      class="bg-white rounded-xl shadow-md overflow-hidden border border-gray-100">
      <div class="overflow-x-auto">
        <table class="min-w-full divide-y divide-gray-200">
          <thead class="bg-gray-50">
            <tr>
              <th scope="col" class="px-4 md:px-8 py-4 text-left text-xs font-medium text-gray-500 uppercase">Release
              </th>
              <th scope="col" class="px-4 md:px-8 py-4 text-left text-xs font-medium text-gray-500 uppercase">Type</th>
              <th scope="col" class="px-4 md:px-8 py-4 text-left text-xs font-medium text-gray-500 uppercase">Status
              </th>
              <th scope="col" class="px-4 md:px-8 py-4 text-left text-xs font-medium text-gray-500 uppercase">Release
                Date</th>
              <th scope="col" class="px-4 md:px-8 py-4 text-left text-xs font-medium text-gray-500 uppercase">Products
              </th>
              <th scope="col" class="px-4 md:px-8 py-4 text-left text-xs font-medium text-gray-500 uppercase">CHG</th>
              <th scope="col" class="px-4 md:px-8 py-4 text-right text-xs font-medium text-gray-500 uppercase">Actions
              </th>
            </tr>
          </thead>
          <tbody class="bg-white divide-y divide-gray-200">
            <tr *ngFor="let release of releases()" class="hover:bg-gray-50 transition-colors cursor-pointer group"
              [routerLink]="['/releases', release.name]">
              <td class="px-4 md:px-8 py-5">
                <div class="flex items-center">
                  <div class="flex-shrink-0 h-10 w-10 bg-purple-50 rounded-lg flex items-center justify-center">
                    <lucide-icon [img]="Rocket" [size]="20" class="text-purple-600"></lucide-icon>
                  </div>
                  <div class="ml-4">
                    <span class="text-sm font-semibold text-gray-900 group-hover:text-indigo-600 transition-colors">
                      {{ release.name }}
                    </span>
                  </div>
                </div>
              </td>
              <td class="px-4 md:px-8 py-5">
                <app-status-badge [status]="release.release_type" type="type">{{ release.release_type
                  }}</app-status-badge>
              </td>
              <td class="px-4 md:px-8 py-5">
                <app-status-badge [status]="release.status" type="status">{{ release.status }}</app-status-badge>
              </td>
              <td class="px-4 md:px-8 py-5 text-sm text-gray-600">
                {{ formatDate(release.release_date) }}
              </td>
              <td class="px-4 md:px-8 py-5 text-sm text-gray-600">
                {{ release.products.length }}
              </td>
              <td class="px-4 md:px-8 py-5 text-sm">
                <a *ngIf="release.chg_number" href="#" class="text-primary-600 hover:text-primary-700 font-medium">
                  {{ release.chg_number }}
                </a>
                <span *ngIf="!release.chg_number" class="text-gray-400">N/A</span>
              </td>
              <td class="px-4 md:px-8 py-5 text-right text-sm font-medium space-x-2 md:space-x-3"
                (click)="$event.stopPropagation()">
                <a [routerLink]="['/releases', release.name, 'edit']"
                  class="text-primary-600 hover:text-primary-700 font-medium">Edit</a>
                <button (click)="deleteRelease(release)" class="text-red-600 hover:text-red-700 font-medium"
                  [disabled]="deleting() === release.id">
                  {{ deleting() === release.id ? 'Deleting...' : 'Delete' }}
                </button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <div *ngIf="!loading() && releases().length === 0"
      class="text-center py-16 bg-white rounded-xl shadow-md border border-gray-100">
      <p class="text-gray-500 text-lg mb-4">No releases found</p>
      <app-button [routerLink]="['/releases/create']" class="mt-4">
        <lucide-icon [img]="Plus" [size]="20" class="mr-2"></lucide-icon>
        Add Release
      </app-button>
    </div>
  </div>
</div>
