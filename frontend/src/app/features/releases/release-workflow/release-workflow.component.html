<div class="workflow-container relative bg-white rounded-lg" style="height: 600px; width: 100%; overflow: hidden;" (click)="closeActions()">
  <svg class="absolute inset-0 w-full h-full" style="z-index: 0;" (click)="$event.stopPropagation()">
    <defs>
      <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
        <circle cx="1" cy="1" r="1" fill="#e5e7eb" />
      </pattern>
    </defs>
    <rect width="100%" height="100%" fill="url(#grid)" />
  </svg>
  <div #chartContainer class="relative" style="z-index: 1; height: 100%; width: 100%;" (click)="$event.stopPropagation()"></div>
  
  <!-- Control buttons -->
  <div class="absolute bottom-4 right-4 flex gap-2 bg-white rounded-lg shadow-lg border border-gray-200 p-2" style="z-index: 10;" (click)="$event.stopPropagation()">
    <button (click)="zoomIn()" class="px-3 py-2 bg-gray-100 hover:bg-gray-200 rounded transition-colors font-semibold" aria-label="Zoom in" title="Zoom In">+</button>
    <button (click)="zoomOut()" class="px-3 py-2 bg-gray-100 hover:bg-gray-200 rounded transition-colors font-semibold" aria-label="Zoom out" title="Zoom Out">−</button>
    <button (click)="fitToScreen()" class="px-3 py-2 bg-gray-100 hover:bg-gray-200 rounded transition-colors" aria-label="Fit to screen" title="Fit to Screen">⤢</button>
    <button 
      (click)="toggleLock()" 
      [class]="isLocked() ? 'px-3 py-2 bg-red-100 hover:bg-red-200 text-red-700 rounded transition-colors' : 'px-3 py-2 bg-green-100 hover:bg-green-200 text-green-700 rounded transition-colors'"
      [attr.aria-label]="isLocked() ? 'Unlock drag' : 'Lock drag'"
      [title]="isLocked() ? 'Click to Enable Dragging' : 'Click to Lock Positions'">
      <lucide-icon [img]="isLocked() ? Lock : Unlock" [size]="16"></lucide-icon>
    </button>
  </div>

  <!-- Action buttons overlay -->
  <div class="absolute top-4 left-4 bg-white rounded-lg shadow-lg border border-gray-200 p-4 max-w-sm" style="z-index: 10;" *ngIf="selectedNode" (click)="$event.stopPropagation()">
    <h3 class="font-semibold text-sm mb-2">{{ selectedNode.label }}</h3>
    <div class="space-y-2">
      <button 
        (click)="advanceSelectedStage()" 
        class="w-full px-3 py-2 bg-blue-500 hover:bg-blue-600 text-white text-sm rounded transition-colors"
        *ngIf="canAdvanceStage()">
        Advance Stage
      </button>
      <button 
        (click)="editSelectedStageDate()" 
        class="w-full px-3 py-2 bg-green-500 hover:bg-green-600 text-white text-sm rounded transition-colors">
        Edit Date
      </button>
      <button 
        (click)="addSelectedAttachment()" 
        class="w-full px-3 py-2 bg-purple-500 hover:bg-purple-600 text-white text-sm rounded transition-colors">
        Add Attachment
      </button>
      <button 
        (click)="closeActions()" 
        class="w-full px-3 py-2 bg-gray-500 hover:bg-gray-600 text-white text-sm rounded transition-colors">
        Close
      </button>
    </div>
  </div>
</div>
