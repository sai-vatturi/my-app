<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
  <div class="space-y-8">
    <div class="flex justify-between items-center">
      <h1 class="text-3xl font-bold text-gray-900">Squads</h1>
      <app-button [routerLink]="['/squads/create']">
        Create Squad
      </app-button>
    </div>

    <app-alert *ngIf="error()" [message]="error()!" type="error" />

    <app-loading-spinner *ngIf="loading()" />

    <div *ngIf="!loading() && squads().length > 0" class="bg-white rounded-xl shadow-md overflow-hidden border border-gray-100">
      <table class="min-w-full divide-y divide-gray-200">
        <thead class="bg-gray-50">
          <tr>
            <th scope="col" class="px-8 py-4 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
              Name
            </th>
            <th scope="col" class="px-8 py-4 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
              Description
            </th>
            <th scope="col" class="px-8 py-4 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
              Team Leads
            </th>
            <th scope="col" class="px-8 py-4 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
              Products
            </th>
            <th scope="col" class="px-8 py-4 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">
              Actions
          </th>
        </tr>
      </thead>
      <tbody class="bg-white divide-y divide-gray-200">
        <tr *ngFor="let squad of squads()" class="hover:bg-gray-50 transition-colors">
          <td class="px-8 py-5 whitespace-nowrap">
            <div class="text-sm font-semibold text-gray-900">{{ squad.name }}</div>
          </td>
          <td class="px-8 py-5">
            <div class="text-sm text-gray-600">{{ squad.description || 'N/A' }}</div>
          </td>
          <td class="px-8 py-5">
            <div class="text-sm text-gray-600">{{ squad.team_leads?.length || 0 }}</div>
          </td>
          <td class="px-8 py-5">
            <div class="text-sm text-gray-600">{{ squad.products?.length || 0 }}</div>
          </td>
          <td class="px-8 py-5 whitespace-nowrap text-right text-sm font-medium space-x-3">
            <a [routerLink]="['/squads', squad.id, 'edit']" class="text-primary-600 hover:text-primary-700 font-medium">
              Edit
            </a>
            <button
              (click)="deleteSquad(squad)"
              class="text-red-600 hover:text-red-700 font-medium"
              [disabled]="deleting() === squad.id">
              {{ deleting() === squad.id ? 'Deleting...' : 'Delete' }}
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div *ngIf="!loading() && squads().length === 0" class="text-center py-16 bg-white rounded-xl shadow-md border border-gray-100">
    <p class="text-gray-500 text-lg mb-4">No squads found</p>
    <app-button [routerLink]="['/squads/create']" class="mt-4">
      Create your first squad
    </app-button>
  </div>
  </div>
</div>
