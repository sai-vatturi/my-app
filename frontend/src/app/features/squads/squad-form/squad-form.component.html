<div class="max-w-4xl">
  <h1 class="text-3xl font-bold text-gray-900 mb-6">{{ isEdit ? 'Edit' : 'Create' }} Squad</h1>
  <app-alert *ngIf="error()" [message]="error()!" type="error" />
  <app-loading-spinner *ngIf="loading()" />
  <form *ngIf="!loading()" [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-6 bg-white shadow rounded-lg p-6">
    <div>
      <label for="name" class="block text-sm font-medium text-gray-700 mb-1">Name <span
          class="text-red-500">*</span></label>
      <input id="name" type="text" formControlName="name"
        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500"
        [class.border-red-500]="form.get('name')?.invalid && form.get('name')?.touched" />
      <p *ngIf="form.get('name')?.invalid && form.get('name')?.touched" class="mt-1 text-sm text-red-600">Squad name is
        required</p>
    </div>
    <div>
      <label for="description" class="block text-sm font-medium text-gray-700 mb-1">Description</label>
      <textarea id="description" formControlName="description" rows="3"
        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500"></textarea>
    </div>

    <!-- Business Unit -->
    <div>
      <label for="business_unit_id" class="block text-sm font-medium text-gray-700 mb-1">Business Unit</label>
      <select id="business_unit_id" formControlName="business_unit_id"
        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500">
        <option value="">Select Business Unit</option>
        <option *ngFor="let unit of businessUnits()" [value]="unit.id || unit._id">
          {{ unit.name }}
        </option>
      </select>
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Team Leads</label>
      <div formArrayName="team_leads" class="space-y-2">
        <div *ngFor="let control of teamLeads.controls; let i = index" class="flex gap-2">
          <input [formControlName]="i" type="text"
            class="flex-1 px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500"
            placeholder="Team lead name" />
          <button type="button" (click)="removeTeamLead(i)"
            class="px-3 py-2 text-red-600 hover:bg-red-50 rounded-lg">Remove</button>
        </div>
      </div>
      <button type="button" (click)="addTeamLead()" class="mt-2 text-sm text-primary-600 hover:text-primary-700">+ Add
        Team Lead</button>
    </div>

    <!-- Products -->
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-2">Associated Products</label>
      <p class="text-xs text-gray-500 mb-3">Add products that this squad works on</p>
      <app-loading-spinner *ngIf="loadingProducts()" />

      <!-- Selected Products -->
      <div *ngIf="!loadingProducts() && productsFormArray.length > 0" class="space-y-2 mb-4">
        <div *ngFor="let control of productsFormArray.controls; let i = index"
          class="flex items-center gap-2 p-2 bg-gray-50 rounded-lg border border-gray-200">
          <span class="flex-1 text-sm text-gray-900">
            {{ getProductName(control.value) }}
          </span>
          <button type="button" (click)="removeProduct(i)"
            class="text-red-600 hover:text-red-800 text-sm font-medium">Remove</button>
        </div>
      </div>

      <!-- Add Product Dropdown -->
      <div *ngIf="!loadingProducts()" class="flex gap-2">
        <select #productSelect
          class="flex-1 px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500" [value]="''">
          <option value="">Select a product to add</option>
          <option *ngFor="let product of availableProducts()" [value]="product.id || product._id">
            {{ product.name }}
          </option>
        </select>
        <button type="button" (click)="addProductFromDropdown(productSelect.value); productSelect.value = ''"
          [disabled]="!productSelect.value || productSelect.value === ''"
          class="px-4 py-2 bg-primary-600 text-white rounded-lg hover:bg-primary-700 disabled:bg-gray-300 disabled:cursor-not-allowed font-medium transition-colors duration-200">
          Add Product
        </button>
      </div>

      <p *ngIf="!loadingProducts() && products().length === 0" class="text-sm text-gray-500 text-center py-4">
        No products available. Create products first.
      </p>
      <p *ngIf="!loadingProducts() && products().length > 0 && availableProducts().length === 0"
        class="text-sm text-blue-600 text-center py-2">
        All available products have been added to this squad.
      </p>
    </div>

    <div class="flex gap-4 pt-4 border-t">
      <app-button type="submit" [disabled]="form.invalid || submitting()" [loading]="submitting()">
        {{ isEdit ? 'Update' : 'Create' }} Squad
      </app-button>
      <app-button type="button" variant="secondary" (clicked)="cancel()">Cancel</app-button>
    </div>
  </form>
</div>
