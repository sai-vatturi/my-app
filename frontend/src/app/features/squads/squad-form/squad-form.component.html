<div class="max-w-4xl">
  <h1 class="text-3xl font-bold text-gray-900 mb-6">{{ isEdit ? 'Edit' : 'Create' }} Squad</h1>
  <app-alert *ngIf="error()" [message]="error()!" type="error" />
  <app-loading-spinner *ngIf="loading()" />
  <form *ngIf="!loading()" [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-6 bg-white shadow rounded-lg p-6">
    <div>
      <label for="name" class="block text-sm font-medium text-gray-700 mb-1">Name <span class="text-red-500">*</span></label>
      <input id="name" type="text" formControlName="name" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500" [class.border-red-500]="form.get('name')?.invalid && form.get('name')?.touched" />
      <p *ngIf="form.get('name')?.invalid && form.get('name')?.touched" class="mt-1 text-sm text-red-600">Squad name is required</p>
    </div>
    <div>
      <label for="description" class="block text-sm font-medium text-gray-700 mb-1">Description</label>
      <textarea id="description" formControlName="description" rows="3" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500"></textarea>
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Team Leads</label>
      <div formArrayName="team_leads" class="space-y-2">
        <div *ngFor="let control of teamLeads.controls; let i = index" class="flex gap-2">
          <input [formControlName]="i" type="text" class="flex-1 px-3 py-2 border border-gray-300 rounded-lg" />
          <button type="button" (click)="removeTeamLead(i)" class="px-3 py-2 text-red-600 hover:bg-red-50 rounded-lg">Remove</button>
        </div>
      </div>
      <button type="button" (click)="addTeamLead()" class="mt-2 text-sm text-primary-600">+ Add Team Lead</button>
    </div>
    <div class="flex gap-4 pt-4 border-t">
      <app-button type="submit" [disabled]="form.invalid || submitting()" [loading]="submitting()">{{ isEdit ? 'Update' : 'Create' }} Squad</app-button>
      <app-button type="button" variant="secondary" (clicked)="cancel()">Cancel</app-button>
    </div>
  </form>
</div>
