<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
  <div class="space-y-8">
    <div class="flex justify-between items-center">
      <h1 class="text-3xl font-bold text-gray-900">Products</h1>
      <app-button [routerLink]="['/products/create']">
        Create Product
      </app-button>
    </div>

    <app-alert *ngIf="error()" [message]="error()!" type="error" />

    <app-loading-spinner *ngIf="loading()" />

    <div *ngIf="!loading() && products().length > 0" class="bg-white rounded-xl shadow-md overflow-hidden border border-gray-100">
      <table class="min-w-full divide-y divide-gray-200">
        <thead class="bg-gray-50">
          <tr>
            <th scope="col" class="px-8 py-4 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
              Name
            </th>
            <th scope="col" class="px-8 py-4 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
              Description
            </th>
            <th scope="col" class="px-8 py-4 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
              JIRA Boards
            </th>
            <th scope="col" class="px-8 py-4 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
              Squads
            </th>
            <th scope="col" class="px-8 py-4 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">
              Actions
          </th>
        </tr>
      </thead>
      <tbody class="bg-white divide-y divide-gray-200">
        <tr *ngFor="let product of products()" class="hover:bg-gray-50 transition-colors">
          <td class="px-8 py-5 whitespace-nowrap">
            <div class="text-sm font-semibold text-gray-900">{{ product.name }}</div>
          </td>
          <td class="px-8 py-5">
            <div class="text-sm text-gray-600">{{ product.description || 'N/A' }}</div>
          </td>
          <td class="px-8 py-5">
            <div class="flex flex-wrap gap-2">
              <span *ngFor="let board of product.jira_boards" class="inline-flex items-center bg-blue-50 text-blue-700 text-xs font-medium px-3 py-1 rounded-full">
                {{ board.board_name }}
              </span>
              <span *ngIf="product.jira_boards.length === 0" class="text-sm text-gray-400">None</span>
            </div>
          </td>
          <td class="px-8 py-5">
            <div class="text-sm text-gray-600">{{ product.squads?.length || 0 }}</div>
          </td>
          <td class="px-8 py-5 whitespace-nowrap text-right text-sm font-medium space-x-3">
            <a [routerLink]="['/products', product.id, 'edit']" class="text-primary-600 hover:text-primary-700 font-medium">
              Edit
            </a>
            <button
              (click)="deleteProduct(product)"
              class="text-red-600 hover:text-red-700 font-medium"
              [disabled]="deleting() === product.id">
              {{ deleting() === product.id ? 'Deleting...' : 'Delete' }}
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div *ngIf="!loading() && products().length === 0" class="text-center py-16 bg-white rounded-xl shadow-md border border-gray-100">
    <p class="text-gray-500 text-lg mb-4">No products found</p>
    <app-button [routerLink]="['/products/create']" class="mt-4">
      Create your first product
    </app-button>
  </div>
  </div>
</div>
