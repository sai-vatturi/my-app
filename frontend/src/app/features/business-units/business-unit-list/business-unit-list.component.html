<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div class="flex justify-between items-center mb-6">
        <div>
            <h1 class="text-2xl font-bold text-gray-900">Business Units</h1>
            <p class="mt-1 text-sm text-gray-500">Manage your business units</p>
        </div>
        <a routerLink="/business-units/new">
            <app-button variant="primary">
                <lucide-icon [img]="Plus" [size]="20" class="mr-2"></lucide-icon>
                Add Business Unit
            </app-button>
        </a>
    </div>

    <app-loading-spinner *ngIf="loading()"></app-loading-spinner>

    <div *ngIf="error()" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4">
        {{ error() }}
    </div>

    <!-- Empty State -->
    <div *ngIf="!loading() && !error() && businessUnits().length === 0"
        class="text-center py-12 bg-white rounded-lg shadow">
        <lucide-icon [img]="Briefcase" [size]="48" class="mx-auto text-gray-400 mb-4"></lucide-icon>
        <h3 class="text-lg font-medium text-gray-900">No business units found</h3>
        <p class="mt-1 text-gray-500">Get started by creating a new business unit.</p>
        <div class="mt-6">
            <a routerLink="/business-units/new">
                <app-button>
                    <lucide-icon [img]="Plus" [size]="20" class="mr-2"></lucide-icon>
                    Add Business Unit
                </app-button>
            </a>
        </div>
    </div>

    <!-- Business Units Table -->
    <div *ngIf="!loading() && !error() && businessUnits().length > 0"
        class="bg-white rounded-xl shadow-md overflow-hidden border border-gray-100">
        <table class="min-w-full divide-y divide-gray-200">
            <thead class="bg-gray-50">
                <tr>
                    <th scope="col"
                        class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                        Name
                    </th>
                    <th scope="col"
                        class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                        Description
                    </th>
                    <th scope="col" class="relative px-6 py-3">
                        <span class="sr-only">Actions</span>
                    </th>
                </tr>
            </thead>
            <tbody class="bg-white divide-y divide-gray-200">
                <tr *ngFor="let unit of businessUnits()" class="hover:bg-gray-50 transition-colors cursor-pointer group"
                    [routerLink]="['/business-units', unit._id || unit.id]">
                    <td class="px-6 py-4 whitespace-nowrap">
                        <div class="flex items-center">
                            <div
                                class="flex-shrink-0 h-10 w-10 bg-indigo-50 rounded-lg flex items-center justify-center">
                                <lucide-icon [img]="Briefcase" [size]="20" class="text-indigo-600"></lucide-icon>
                            </div>
                            <div class="ml-4">
                                <div
                                    class="text-sm font-medium text-gray-900 group-hover:text-indigo-600 transition-colors">
                                    {{ unit.name }}
                                </div>
                            </div>
                        </div>
                    </td>
                    <td class="px-6 py-4">
                        <div class="text-sm text-gray-500 line-clamp-1">{{ unit.description || '-' }}</div>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium"
                        (click)="$event.stopPropagation()">
                        <a [routerLink]="['/business-units', unit._id || unit.id, 'edit']"
                            class="text-indigo-600 hover:text-indigo-900 mr-4">
                            <lucide-icon [img]="Edit2" [size]="18" class="inline"></lucide-icon>
                        </a>
                        <button (click)="deleteUnit(unit._id || unit.id!)" class="text-red-600 hover:text-red-900">
                            <lucide-icon [img]="Trash2" [size]="18" class="inline"></lucide-icon>
                        </button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
