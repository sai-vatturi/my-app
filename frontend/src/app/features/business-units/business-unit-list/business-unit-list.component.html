<div class="container mx-auto px-4 py-8">
    <div class="flex justify-between items-center mb-6">
        <h1 class="text-2xl font-bold text-gray-800">Business Units</h1>
        <a routerLink="/business-units/new">
            <app-button variant="primary">Create Business Unit</app-button>
        </a>
    </div>

    <app-loading-spinner *ngIf="loading()"></app-loading-spinner>

    <div *ngIf="error()" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4">
        {{ error() }}
    </div>

    <div *ngIf="!loading() && !error()" class="bg-white shadow-md rounded-lg overflow-hidden">
        <div *ngIf="businessUnits().length === 0" class="p-8 text-center text-gray-500">
            No business units found. Create one to get started.
        </div>

        <table *ngIf="businessUnits().length > 0" class="min-w-full divide-y divide-gray-200">
            <thead class="bg-gray-50">
                <tr>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Name</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                        Description</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Actions
                    </th>
                </tr>
            </thead>
            <tbody class="bg-white divide-y divide-gray-200">
                <tr *ngFor="let unit of businessUnits()">
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">{{ unit.name }}</td>
                    <td class="px-6 py-4 text-sm text-gray-500">{{ unit.description || '-' }}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium space-x-2">
                        <a [routerLink]="['/business-units', unit._id || unit.id, 'edit']"
                            class="text-indigo-600 hover:text-indigo-900">Edit</a>
                        <button (click)="deleteUnit(unit._id || unit.id!)"
                            class="text-red-600 hover:text-red-900">Delete</button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
