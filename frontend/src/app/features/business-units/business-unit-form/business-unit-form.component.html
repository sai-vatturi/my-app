<div class="max-w-4xl">
    <h1 class="text-3xl font-bold text-gray-900 mb-6">{{ isEditMode() ? 'Edit' : 'Create' }} Business Unit</h1>
    <app-alert *ngIf="error()" [message]="error()!" type="error" />
    <app-loading-spinner *ngIf="loading()" />
    <form *ngIf="!loading()" [formGroup]="form" (ngSubmit)="onSubmit()"
        class="space-y-6 bg-white shadow rounded-lg p-6">
        <!-- Name -->
        <div>
            <label for="name" class="block text-sm font-medium text-gray-700 mb-1">Name <span
                    class="text-red-500">*</span></label>
            <input id="name" type="text" formControlName="name"
                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500"
                [class.border-red-500]="form.get('name')?.invalid && form.get('name')?.touched"
                placeholder="Enter business unit name" />
            <p *ngIf="form.get('name')?.invalid && form.get('name')?.touched" class="mt-1 text-sm text-red-600">
                Business unit name is required
            </p>
        </div>

        <!-- Description -->
        <div>
            <label for="description" class="block text-sm font-medium text-gray-700 mb-1">Description</label>
            <textarea id="description" formControlName="description" rows="3"
                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500"
                placeholder="Brief description of the business unit..."></textarea>
        </div>

        <!-- Actions -->
        <div class="flex gap-4 pt-4 border-t">
            <app-button type="submit" [disabled]="form.invalid || loading()" [loading]="loading()">
                {{ isEditMode() ? 'Update' : 'Create' }} Business Unit
            </app-button>
            <app-button type="button" variant="secondary" routerLink="/business-units">Cancel</app-button>
        </div>
    </form>
</div>
