<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <!-- Loading State -->
    <app-loading-spinner *ngIf="loading()"></app-loading-spinner>

    <!-- Error State -->
    <div *ngIf="error()" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4">
        {{ error() }}
        <button (click)="navigateBack()" class="ml-4 underline">Go back</button>
    </div>

    <!-- Content -->
    <div *ngIf="!loading() && !error() && businessUnit()">
        <!-- Header -->
        <div class="flex justify-between items-center mb-8">
            <div class="flex items-center">
                <button (click)="navigateBack()" class="mr-4 p-2 rounded-lg hover:bg-gray-100 transition-colors">
                    <lucide-icon [img]="ArrowLeft" [size]="20" class="text-gray-600"></lucide-icon>
                </button>
                <div class="flex items-center">
                    <div class="flex-shrink-0 h-12 w-12 bg-indigo-50 rounded-lg flex items-center justify-center mr-4">
                        <lucide-icon [img]="Briefcase" [size]="24" class="text-indigo-600"></lucide-icon>
                    </div>
                    <div>
                        <h1 class="text-2xl font-bold text-gray-900">{{ businessUnit()?.name }}</h1>
                        <p *ngIf="businessUnit()?.description" class="text-sm text-gray-500 mt-1">
                            {{ businessUnit()?.description }}
                        </p>
                    </div>
                </div>
            </div>
            <app-button (clicked)="navigateToEdit()">
                <lucide-icon [img]="Edit2" [size]="18" class="mr-2"></lucide-icon>
                Edit
            </app-button>
        </div>

        <!-- Associated Entities - Stacked Vertically -->
        <div class="flex flex-col gap-6">
            <!-- Products Card -->
            <div class="bg-white rounded-xl shadow-md overflow-hidden border border-gray-100">
                <div class="px-6 py-4 border-b border-gray-100 bg-gray-50">
                    <div class="flex items-center justify-between">
                        <div class="flex items-center">
                            <lucide-icon [img]="Package" [size]="20" class="text-blue-500 mr-2"></lucide-icon>
                            <h3 class="text-lg font-semibold text-gray-900">Products</h3>
                        </div>
                        <span
                            class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-blue-100 text-blue-800">
                            {{ associatedProducts().length }}
                        </span>
                    </div>
                </div>
                <div class="px-6 py-4">
                    <div *ngIf="associatedProducts().length > 0" class="flex flex-wrap gap-2">
                        <a *ngFor="let product of associatedProducts()"
                            [routerLink]="['/products', product._id || product.id, 'edit']"
                            class="inline-flex items-center px-3 py-1.5 rounded-md text-sm font-medium bg-blue-50 text-blue-700 border border-blue-100 hover:bg-blue-100 transition-colors cursor-pointer">
                            <lucide-icon [img]="Package" [size]="14" class="mr-1.5"></lucide-icon>
                            {{ product.name }}
                        </a>
                    </div>
                    <div *ngIf="associatedProducts().length === 0" class="text-center py-4">
                        <lucide-icon [img]="Package" [size]="32" class="mx-auto text-gray-300 mb-2"></lucide-icon>
                        <p class="text-sm text-gray-400 italic">No products associated</p>
                    </div>
                </div>
            </div>

            <!-- Squads Card -->
            <div class="bg-white rounded-xl shadow-md overflow-hidden border border-gray-100">
                <div class="px-6 py-4 border-b border-gray-100 bg-gray-50">
                    <div class="flex items-center justify-between">
                        <div class="flex items-center">
                            <lucide-icon [img]="Users" [size]="20" class="text-green-500 mr-2"></lucide-icon>
                            <h3 class="text-lg font-semibold text-gray-900">Squads</h3>
                        </div>
                        <span
                            class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-green-100 text-green-800">
                            {{ associatedSquads().length }}
                        </span>
                    </div>
                </div>
                <div class="px-6 py-4">
                    <div *ngIf="associatedSquads().length > 0" class="flex flex-wrap gap-2">
                        <a *ngFor="let squad of associatedSquads()"
                            [routerLink]="['/squads', squad._id || squad.id, 'edit']"
                            class="inline-flex items-center px-3 py-1.5 rounded-md text-sm font-medium bg-green-50 text-green-700 border border-green-100 hover:bg-green-100 transition-colors cursor-pointer">
                            <lucide-icon [img]="Users" [size]="14" class="mr-1.5"></lucide-icon>
                            {{ squad.name }}
                        </a>
                    </div>
                    <div *ngIf="associatedSquads().length === 0" class="text-center py-4">
                        <lucide-icon [img]="Users" [size]="32" class="mx-auto text-gray-300 mb-2"></lucide-icon>
                        <p class="text-sm text-gray-400 italic">No squads associated</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
