---
- name: Deploy {{ application }} {{ buildversion }}
  hosts: all
  gather_facts: yes
  become_method: runas

  vars_files:
    - ../../../secret.yml

  vars:
    timestamp: "{{ ansible_date_time.iso8601_basic | regex_replace(':','-') }}"
    extract_dir: "{{ temp_extract_path }}\\deploy_{{ timestamp }}"
    artifact_zip: "{{ extract_dir }}\\{{ nexus_file_name }}.zip"
    backup_dir: "{{ backup_destination_path }}\\backup_{{ timestamp }}"

  tasks:
    ############################################################
    # Prep
    ############################################################
    - name: Ensure extract dir
      win_file:
        path: "{{ extract_dir }}"
        state: directory

    - name: Ensure backup dir
      win_file:
        path: "{{ backup_dir }}"
        state: directory

    ############################################################
    # Backup
    ############################################################
    - name: Backup existing content
      win_robocopy:
        src: "{{ backup_source_paths }}"
        dest: "{{ backup_dir }}"
        flags: /E /COPY:DAT /R:1 /W:2

    ############################################################
    # Download & Extract
    ############################################################
    - name: Download artifact
      win_get_url:
        url: "{{ nexus_artifact_file }}"
        dest: "{{ artifact_zip }}"
        url_username: "{{ nexus_user }}"
        url_password: "{{ nexus_pass }}"

    - name: Extract artifact
      win_unzip:
        src: "{{ artifact_zip }}"
        dest: "{{ extract_dir }}"
        delete_archive: yes

    ############################################################
    # NORMALIZE copy_jobs (CRITICAL FIX)
    ############################################################
    - name: Normalize copy_jobs
      set_fact:
        normalized_copy_jobs: >-
          {{
            copy_jobs
            | map(
                'ternary',
                (item is iterable and item is not mapping),
                item | combine,
                item
              )
          }}
      loop: "{{ copy_jobs }}"
      loop_control:
        loop_var: item

    ############################################################
    # Deploy
    ############################################################
    - name: Deploy files
      win_shell: |
        $artifactRoot = "{{ extract_dir }}"

        $relativeSrc = "{{ item.source_path | default('') }}"
        if ([string]::IsNullOrWhiteSpace($relativeSrc)) {
          $src = $artifactRoot
        } else {
          $src = Join-Path $artifactRoot $relativeSrc
        }

        $dst = "{{ item.destination_path }}"

        if (-not (Test-Path $src)) {
          Write-Error "Source path missing: $src"
          exit 1
        }

        if (-not (Test-Path $dst)) {
          Write-Error "Destination path missing: $dst"
          exit 1
        }

        $excludeArgs = @()
        {% for p in item.exclude_paths | default([]) %}
        $excludeArgs += "/XD"
        $excludeArgs += "{{ p }}"
        {% endfor %}

        robocopy "$src" "$dst" /E /COPY:DAT /R:2 /W:2 @excludeArgs
        exit 0
      args:
        executable: powershell
      loop: "{{ normalized_copy_jobs }}"
      loop_control:
        label: "{{ item.destination_path }}"

    ############################################################
    # Config replacement
    ############################################################
    - name: Replace configs
      win_shell: |
        $env = "{{ config_env }}"

        {% for c in configs | default([]) %}
        $base = Join-Path "{{ extract_dir }}" "{{ c }}"

        if (Test-Path $base) {
          $webEnv = Join-Path $base ("web.$env.config")
          $webMain = Join-Path $base "web.config"
          if (Test-Path $webEnv) { Copy-Item $webEnv $webMain -Force }

          $appEnv = Join-Path $base ("appsettings.$env.json")
          $appMain = Join-Path $base "appsettings.json"
          if (Test-Path $appEnv) { Copy-Item $appEnv $appMain -Force }
        }
        {% endfor %}
      args:
        executable: powershell

  post_tasks:
    - name: Cleanup
      win_file:
        path: "{{ extract_dir }}"
        state: absent
      ignore_errors: yes