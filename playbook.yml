---
- name: Deploy {{ application }} {{ buildversion }}
  hosts: all
  gather_facts: yes
  become_method: runas

  vars_files:
    - ../../secret.yml

  vars:
    timestamp: "{{ ansible_date_time.iso8601_basic | regex_replace(':','-') }}"
    extract_dir: "{{ temp_extract_path }}\\deploy_{{ timestamp }}"
    artifact_zip: "{{ extract_dir }}\\{{ nexus_file_name }}.zip"
    backup_dir: "{{ backup_destination_path }}\\backup_{{ timestamp }}"

  tasks:
    ####################################################################
    # Preparation
    ####################################################################
    - name: Ensure extraction directory exists
      win_file:
        path: "{{ extract_dir }}"
        state: directory

    - name: Ensure backup directory exists
      win_file:
        path: "{{ backup_dir }}"
        state: directory

    ####################################################################
    # Backup
    ####################################################################
    - name: Backup application directories
      win_robocopy:
        src: "{{ backup_source_paths }}"
        dest: "{{ backup_dir }}"
        flags: /E /COPY:DAT /R:1 /W:2
      register: backup_result

    ####################################################################
    # Download + Extract
    ####################################################################
    - name: Download artifact from Nexus
      win_get_url:
        url: "{{ nexus_artifact_file }}"
        dest: "{{ artifact_zip }}"
        url_username: "{{ nexus_user }}"
        url_password: "{{ nexus_pass }}"

    - name: Unzip artifact
      win_unzip:
        src: "{{ artifact_zip }}"
        dest: "{{ extract_dir }}"
        delete_archive: yes

    ####################################################################
    # Deploy content (preserve excluded paths)
    ####################################################################
    - name: Deploy files using robocopy per copy_job
      win_shell: |
        $src = "{{ extract_dir }}"
        $dst = "{{ item.destination_path }}"

        if (-not (Test-Path $dst)) {
          Write-Error "Destination path does not exist: $dst"
          exit 1
        }

        $excludeArgs = @()
        {% for p in item.exclude_paths | default([]) %}
        $excludeArgs += "/XD"
        $excludeArgs += "{{ p }}"
        {% endfor %}

        robocopy "$src" "$dst" /E /COPY:DAT /R:2 /W:2 @excludeArgs
        exit 0
      args:
        executable: powershell
      loop: "{{ copy_jobs }}"
      loop_control:
        label: "{{ item.destination_path }}"

    ####################################################################
    # Config Management (uses config_env, NOT nexus_environment)
    ####################################################################
    - name: Replace web.config and appsettings.json per config_env
      win_shell: |
        $env = "{{ config_env }}"

        {% for cfg in configs %}
        $base = Join-Path "{{ extract_dir }}" "{{ cfg }}"

        if (Test-Path $base) {

          # ---- web.config handling ----
          $webEnv = Join-Path $base ("web.$env.config")
          $webMain = Join-Path $base "web.config"

          if (Test-Path $webEnv) {
            Write-Output "Replacing web.config in $base"
            Copy-Item $webEnv $webMain -Force
          }

          # ---- appsettings.json handling ----
          $appEnv = Join-Path $base ("appsettings.$env.json")
          $appMain = Join-Path $base "appsettings.json"

          if (Test-Path $appEnv) {
            Write-Output "Replacing appsettings.json in $base"
            Copy-Item $appEnv $appMain -Force
          }
        }
        {% endfor %}
      args:
        executable: powershell
      when:
        - configs is defined
        - configs | length > 0
        - config_env is defined
        - config_env | length > 0

  post_tasks:
    ####################################################################
    # Cleanup
    ####################################################################
    - name: Cleanup temporary directory
      win_file:
        path: "{{ extract_dir }}"
        state: absent
      ignore_errors: yes