---
- name: Deploy {{ application }} {{ buildversion }}
  hosts: all
  gather_facts: yes
  become_method: runas

  vars_files:
    - ../../../secret.yml

  vars:
    timestamp: "{{ ansible_date_time.iso8601_basic | regex_replace(':','-') }}"
    extract_dir: "{{ temp_extract_path }}\\deploy_{{ timestamp }}"
    artifact_zip: "{{ extract_dir }}\\{{ nexus_file_name }}.zip"
    backup_dir: "{{ backup_destination_path }}\\backup_{{ timestamp }}"

  tasks:
    # -------------------------------------------------------------------------
    # 1. DATA SANITIZATION (CRITICAL FIX)
    # AWX may send copy_jobs in a broken format where each job is a list of 
    # fragments like ["source_path:xxx", "destination_path:yyy", {"exclude_paths":[]}]
    # This task reconstructs them into proper dicts.
    # -------------------------------------------------------------------------
    - name: Parse and normalize copy_jobs from AWX
      set_fact:
        final_copy_jobs: >-
          {%- set result = [] -%}
          {%- for item in copy_jobs -%}
            {%- if item is mapping -%}
              {# Item is already a proper dict, use as-is #}
              {%- set _ = result.append(item) -%}
            {%- elif item is sequence and item is not string -%}
              {# Item is a fragmented list - reconstruct into a single dict #}
              {%- set merged = {} -%}
              {%- for fragment in item -%}
                {%- if fragment is mapping -%}
                  {# Fragment is a dict (e.g., {"exclude_paths": [...]}) #}
                  {%- set merged = merged | combine(fragment) -%}
                {%- elif fragment is string -%}
                  {# Fragment is a string like "key:value" #}
                  {%- set colon_idx = fragment.find(':') -%}
                  {%- if colon_idx > 0 -%}
                    {%- set key = fragment[:colon_idx] | trim -%}
                    {%- set val = fragment[colon_idx+1:] | trim -%}
                    {# Handle null/None values #}
                    {%- if val == 'null' or val == 'None' or val == '' -%}
                      {%- set merged = merged | combine({key: None}) -%}
                    {%- else -%}
                      {%- set merged = merged | combine({key: val}) -%}
                    {%- endif -%}
                  {%- endif -%}
                {%- endif -%}
              {%- endfor -%}
              {%- set _ = result.append(merged) -%}
            {%- endif -%}
          {%- endfor -%}
          {{ result }}

    - name: Debug - Show normalized copy_jobs
      debug:
        var: final_copy_jobs
        verbosity: 0

    # -------------------------------------------------------------------------
    # 2. PREP & BACKUP
    # -------------------------------------------------------------------------
    - name: Ensure extraction directory exists
      win_file:
        path: "{{ extract_dir }}"
        state: directory

    - name: Ensure backup directory exists
      win_file:
        path: "{{ backup_dir }}"
        state: directory

    - name: Backup existing content
      win_robocopy:
        src: "{{ backup_source_paths }}"
        dest: "{{ backup_dir }}"
        flags: /E /COPY:DAT /R:1 /W:2

    # -------------------------------------------------------------------------
    # 3. DOWNLOAD & EXTRACT
    # -------------------------------------------------------------------------
    - name: Download artifact from Nexus
      win_get_url:
        url: "{{ nexus_artifact_file }}"
        dest: "{{ artifact_zip }}"
        url_username: "{{ nexus_user }}"
        url_password: "{{ nexus_pass }}"
        force_basic_auth: yes

    - name: Extract artifact
      win_unzip:
        src: "{{ artifact_zip }}"
        dest: "{{ extract_dir }}"
        delete_archive: yes

    # -------------------------------------------------------------------------
    # 4. DEPLOYMENT (HANDLES NULL SOURCES & MULTIPLE JOBS)
    # -------------------------------------------------------------------------
    - name: Deploy files using robocopy logic
      win_shell: |
        $ErrorActionPreference = "Stop"
        
        # We use the sanitized variable 'final_copy_jobs'
        $jobs = '{{ final_copy_jobs | to_json }}' | ConvertFrom-Json
        $artifactRoot = "{{ extract_dir }}"

        foreach ($job in $jobs) {
            # --- 4a. Resolve Source Path ---
            $srcRel = $job.source_path
            
            # Checks for NULL, EMPTY, or WHITESPACE
            if ([string]::IsNullOrWhiteSpace($srcRel)) {
                $src = $artifactRoot
                Write-Host "Source path is null/empty. Using root: $src"
            } else {
                $src = Join-Path $artifactRoot $srcRel
                Write-Host "Source path is subdirectory: $src"
            }

            # --- 4b. Resolve Destination Path ---
            $dst = $job.destination_path
            Write-Host "Destination: $dst"

            # --- 4c. Validation ---
            if (-not (Test-Path $src)) {
                Write-Error "CRITICAL: Source path does not exist: $src"
                exit 1 
            }
            if (-not (Test-Path $dst)) {
                Write-Host "Creating destination directory..."
                New-Item -ItemType Directory -Force -Path $dst | Out-Null
            }

            # --- 4d. Build Robocopy Arguments ---
            # Standard flags
            $robocopyArgs = @($src, $dst, "/E", "/COPY:DAT", "/R:2", "/W:2")
            
            # Add Excludes if they exist
            if ($job.exclude_paths) {
                $robocopyArgs += "/XD"
                foreach ($p in $job.exclude_paths) {
                    $robocopyArgs += $p
                }
            }

            # --- 4e. Execute & Handle Exit Codes ---
            Write-Host "Running Robocopy..."
            & robocopy @robocopyArgs
            
            # Robocopy Codes: 0=NoCopy, 1=CopySuccess, 2=ExtraFiles, 4=Mismatches, 8=Fail
            if ($LASTEXITCODE -ge 8) {
                Write-Error "Robocopy failed with exit code $LASTEXITCODE"
                exit $LASTEXITCODE
            } else {
                # Force success for Ansible if code is 0-7
                $global:LASTEXITCODE = 0
            }
        }
      args:
        executable: powershell

    # -------------------------------------------------------------------------
    # 5. CONFIG REPLACEMENT & CLEANUP
    # -------------------------------------------------------------------------
    - name: Replace configs
      win_shell: |
        $env = "{{ config_env }}"
        Write-Host "Performing config replacement for environment: $env"
        # Insert specific config replacement logic here if needed
      args:
        executable: powershell

  post_tasks:
    - name: Cleanup extraction folder
      win_file:
        path: "{{ extract_dir }}"
        state: absent
      ignore_errors: yes
