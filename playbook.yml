---
- name: Deploy {{ application }} {{ buildversion }}
  hosts: all
  gather_facts: yes
  become_method: runas

  vars_files:
    - ../../../secret.yml

  vars:
    timestamp: "{{ ansible_date_time.iso8601_basic | regex_replace(':','-') }}"
    extract_dir: "{{ temp_extract_path }}\\deploy_{{ timestamp }}"
    artifact_zip: "{{ extract_dir }}\\{{ nexus_file_name }}.zip"
    backup_dir: "{{ backup_destination_path }}\\backup_{{ timestamp }}"

  tasks:
    ####################################################################
    # Preparation
    ####################################################################
    - name: Ensure extraction directory exists
      win_file:
        path: "{{ extract_dir }}"
        state: directory

    - name: Ensure backup directory exists
      win_file:
        path: "{{ backup_dir }}"
        state: directory

    ####################################################################
    # Backup existing deployment
    ####################################################################
    - name: Backup existing content
      win_robocopy:
        src: "{{ backup_source_paths }}"
        dest: "{{ backup_dir }}"
        flags: /E /COPY:DAT /R:1 /W:2

    ####################################################################
    # Download and extract artifact
    ####################################################################
    - name: Download artifact from Nexus
      win_get_url:
        url: "{{ nexus_artifact_file }}"
        dest: "{{ artifact_zip }}"
        url_username: "{{ nexus_user }}"
        url_password: "{{ nexus_pass }}"

    - name: Extract artifact
      win_unzip:
        src: "{{ artifact_zip }}"
        dest: "{{ extract_dir }}"
        delete_archive: yes

    ####################################################################
    # Deploy files (ROBUST AGAINST BROKEN DOWNSTREAM STRUCTURE)
    ####################################################################
    - name: Deploy files using robocopy
      win_shell: |
        $artifactRoot = "{{ extract_dir }}"

        foreach ($job in {{ copy_jobs | to_json }}) {

          # Normalize broken downstream format
          if ($job -is [System.Collections.IEnumerable] -and -not ($job -is [hashtable])) {
            $flat = @{}
            foreach ($part in $job) {
              if ($part -is [hashtable]) {
                foreach ($k in $part.Keys) {
                  $flat[$k] = $part[$k]
                }
              }
            }
            $job = $flat
          }

          # Resolve source path
          $srcRel = $job.source_path
          if ([string]::IsNullOrWhiteSpace($srcRel)) {
            $src = $artifactRoot
          } else {
            $src = Join-Path $artifactRoot $srcRel
          }

          $dst = $job.destination_path

          if (-not (Test-Path $src)) {
            Write-Error "Source path does not exist: $src"
            exit 1
          }

          if (-not (Test-Path $dst)) {
            Write-Error "Destination path does not exist: $dst"
            exit 1
          }

          # Build exclude args
          $excludeArgs = @()
          if ($job.exclude_paths) {
            foreach ($p in $job.exclude_paths) {
              $excludeArgs += "/XD"
              $excludeArgs += $p
            }
          }

          Write-Output "Deploying from $src to $dst"
          robocopy "$src" "$dst" /E /COPY:DAT /R:2 /W:2 @excludeArgs
        }
      args:
        executable: powershell

    ####################################################################
    # Config replacement (SAFE, OPTIONAL)
    ####################################################################
    - name: Replace environment-specific configs
      win_shell: |
        $env = "{{ config_env }}"

        {% for c in configs | default([]) %}
        $base = Join-Path "{{ extract_dir }}" "{{ c }}"

        if (Test-Path $base) {

          # web.config
          $webEnv = Join-Path $base ("web.$env.config")
          if (Test-Path $webEnv) {
            Copy-Item $webEnv (Join-Path $base "web.config") -Force
          }

          # appsettings.json
          $appEnv = Join-Path $base ("appsettings.$env.json")
          if (Test-Path $appEnv) {
            Copy-Item $appEnv (Join-Path $base "appsettings.json") -Force
          }
        }
        {% endfor %}
      args:
        executable: powershell
      when:
        - config_env is defined
        - config_env | length > 0

  ####################################################################
  # Cleanup
  ####################################################################
  post_tasks:
    - name: Cleanup temporary extraction directory
      win_file:
        path: "{{ extract_dir }}"
        state: absent
      ignore_errors: yes